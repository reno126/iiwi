services:
  db:
    build:
      context: .
      dockerfile: Dockerfile
    image: iiwii:latest
    container_name: iiwii-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iiwii}
      POSTGRES_USER: ${POSTGRES_USER:-pg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a unique database password}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - iiwii_pgdata:/var/lib/postgresql/data

volumes:
  iiwii_pgdata:
