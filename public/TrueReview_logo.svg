<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">TrueReview</title>
  <desc id="desc">Logo for an independent product review platform.</desc>

  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1268F3"/>
      <stop offset="1" stop-color="#0750D7"/>
    </linearGradient>
    <linearGradient id="wordBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#075FEA"/>
      <stop offset="1" stop-color="#1980FF"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <g transform="translate(28 42)">
    <!-- review bubble -->
    <path d="M42 0h190c23 0 42 19 42 42v91c0 23-19 42-42 42H128l-54 43c-12 9-29 1-29-14v-29C18 167 0 149 0 126V42C0 19 19 0 42 0Z"
          fill="white" stroke="url(#blue)" stroke-width="12"/>

    <!-- stars -->
    <g fill="#F5B51B">
      <path d="M58 39l7 15 16 2-12 11 3 16-14-8-14 8 3-16-12-11 16-2z"/>
      <path d="M98 39l7 15 16 2-12 11 3 16-14-8-14 8 3-16-12-11 16-2z"/>
      <path d="M138 39l7 15 16 2-12 11 3 16-14-8-14 8 3-16-12-11 16-2z"/>
      <path d="M178 39l7 15 16 2-12 11 3 16-14-8-14 8 3-16-12-11 16-2z"/>
    </g>
    <path d="M218 39l7 15 16 2-12 11 3 16-14-8-14 8 3-16-12-11 16-2z" fill="#CBD5E1"/>

    <!-- review lines -->
    <rect x="55" y="103" width="145" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="55" y="124" width="105" height="10" rx="5" fill="#CBD5E1"/>

    <!-- magnifier -->
    <circle cx="240" cy="143" r="57" fill="white" stroke="url(#blue)" stroke-width="12"/>
    <circle cx="240" cy="143" r="38" fill="#F8FAFC"/>
    <path d="M220 143l13 13 30-32" fill="none" stroke="#20B96B" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M282 185l39 39" stroke="url(#blue)" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="360" y="154"
        font-family="Arial, Helvetica, sans-serif"
        font-size="108"
        font-weight="800"
        letter-spacing="-5">
    <tspan fill="#102A52">True</tspan><tspan fill="url(#wordBlue)">Review</tspan>
  </text>

  <!-- Tagline -->
  <text x="365" y="207"
        font-family="Arial, Helvetica, sans-serif"
        font-size="24"
        font-weight="700"
        letter-spacing="5"
        fill="#17345F">REALNE OPINIE. LEPSZE WYBORY.</text>
</svg>